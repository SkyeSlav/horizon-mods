id = "autologin"

kind = "native-mod"

name = "Auto Login"

summary = "Logs you in on join when a password is saved, and watches for login/register prompts in chat, per server."

description = """
Auto Login logs you in on join when a password is saved for that server and player — no prompt needed. When no password is saved, it watches for login and register prompts — in chat, in the action bar and on the boss bar — and acts on them: when the server asks you to register, it generates a random password, sends /register, and saves it for next time.

Manual commands /autologin and /autoregister do the same on demand, and /autologin set, pattern, delay, toggle and status configure it without rebuilding.

Passwords are stored in plain text on the device, one line per server, in the mod's own data files — use a password made just for that server."""

authors = ["SkyeSlav"]

owners = ["SkyeSlav"]

owner_ids = [13040310]

license = "MIT"

source = "https://github.com/SkyeSlav/horizon-autologin"

icon = "icons/autologin.png"

categories = ["utility", "management"]

tags = ["login", "auto-login", "auth", "automation"]

