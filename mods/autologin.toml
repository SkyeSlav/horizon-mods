changelog = "Per-server consent: a saved password stays inactive until you allow it on that server with /autologin allow; /autologin set takes the password twice, and /al is a short alias for /autologin. A generated register password is saved only when the /register is actually sent; a register prompt is remembered even if it scrolls away before you allow; consent migrates to the account-UUID key with the password; generated passwords now use the whole configured charset. The one-attempt limit survives a proxy reconfiguration."
