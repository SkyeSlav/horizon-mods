changelog = "Passwords are now keyed by server and account UUID, so a saved password is only sent for the exact server and account it was saved for (older name-keyed passwords migrate to the UUID key on join); the promptless login is consumed once per connection, so it cannot repeat and trip a rate limit; a queued login is cancelled when auto-login is switched off, and the toggle and the saved password are rechecked just before sending."
